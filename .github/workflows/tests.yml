name: Tests

on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Octave
      run: |
        sudo apt-get update
        sudo apt-get install -y octave

    - name: Run tests
      run: |
        octave --eval "run_tests('verbose')"

    - name: Verify QuickTest data loading
      run: |
        octave --eval "setup_paths(); FS = load_problems('data/taillard_20x5.json'); fprintf('Loaded %d problems\n', length(FS));"
